<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="반응형 다크 테마 프로페셔널 웹사이트">
    <title>프로페셔널 스페이스</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#home" aria-label="홈으로 이동">프로페셔널 스페이스</a>
      <nav aria-label="주요 메뉴">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#games">Games</a>
      </nav>
    </header>

    <main id="home" class="container">
      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">WELCOME</p>
        <h1 id="hero-title">아이디어를 경험으로 만듭니다.</h1>
        <p class="lede">프로필 정보는 공개하지 않는 정적 포트폴리오 공간입니다.</p>
      </section>

      <section id="about" class="panel" aria-labelledby="about-title">
        <h2 id="about-title">About</h2>
        <p>개인정보 없이 프로젝트와 인터랙티브 경험에 집중하는 공간입니다.</p>
      </section>

      <section id="projects" class="panel" aria-labelledby="projects-title">
        <h2 id="projects-title">Projects</h2>
        <p>프로젝트 콘텐츠는 확인된 자료가 준비되면 추가합니다.</p>
      </section>

      <section id="games" class="panel game-shell" aria-labelledby="games-title">
        <p class="eyebrow">GAMES</p>
        <h2 id="games-title">핀볼 아케이드</h2>
        <p>게임 화면을 준비 중입니다. 다음 루프에서 쉬운 핀볼과 미사일 기능을 연결합니다.</p>
      </section>
    </main>

    <footer class="site-footer">정적 웹사이트 · 개인정보 비공개</footer>
  </body>
</html>
