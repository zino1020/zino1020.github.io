<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
  <title id="title">Abstract orbit</title>
  <desc id="desc">Colorful orbital rings on a dark background.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff4f8b"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="560" height="280" rx="32" fill="#1b1b22"/>
  <ellipse cx="280" cy="140" rx="205" ry="68" fill="none" stroke="url(#g)" stroke-width="12" transform="rotate(-18 280 140)"/>
  <ellipse cx="280" cy="140" rx="205" ry="68" fill="none" stroke="#ffd166" stroke-opacity=".7" stroke-width="4" transform="rotate(34 280 140)"/>
  <circle cx="280" cy="140" r="30" fill="#f5f5f7"/>
  <circle cx="450" cy="84" r="10" fill="#7fffd4"/>
</svg>
